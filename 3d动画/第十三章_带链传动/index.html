<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>带传动/链传动 3D 模拟器</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; color: #2a3140; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.9); border: 1px solid #dde3ec; border-radius: 10px;
    padding: 14px 16px; width: 290px; backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 6px 4px; font-size: 12px; border-radius: 6px; border: 1px solid #c9dcff;
    background: #eef2f8; color: #6b7684; cursor: pointer; }
  .tabs button.active { background: #eaf1ff; color: #2f6fed; }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #6b7684; margin-bottom: 4px; }
  .row input[type=range] { width: 100%; accent-color: #2f6fed; }
  #info { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7;
    background: #eaf1ff; color: #2f6fed; border: 1px solid #c9dcff; }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #9aa5b1; z-index: 10; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="panel">
    <h1>带传动 / 链传动</h1>
    <div class="tabs">
      <button id="tabBelt" class="active">带传动（摩擦型）</button>
      <button id="tabChain">链传动（啮合型）</button>
    </div>
    <div class="row">
      <label><span>主动轮半径 r1</span><span id="r1Val"></span></label>
      <input type="range" id="r1" min="0.3" max="0.7" step="0.05" value="0.4">
    </div>
    <div class="row">
      <label><span>从动轮半径 r2</span><span id="r2Val"></span></label>
      <input type="range" id="r2" min="0.3" max="1.0" step="0.05" value="0.7">
    </div>
    <div class="row" id="slipRow">
      <label><span>打滑率（示意）</span><span id="slipVal"></span></label>
      <input type="range" id="slip" min="0" max="20" step="1" value="0">
    </div>
    <div class="row">
      <label><span>主动轮转速</span><span id="speedVal"></span></label>
      <input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1.2">
    </div>
    <div id="info"></div>
  </div>
  <div id="hint">鼠标拖动旋转视角 · 滚轮缩放 · 右键拖动平移</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
