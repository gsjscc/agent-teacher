<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>齿轮传动 3D 模拟器</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; color: #2a3140; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.9); border: 1px solid #dde3ec; border-radius: 10px;
    padding: 14px 16px; width: 280px; backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #6b7684; margin-bottom: 4px; }
  .row input[type=range] { width: 100%; accent-color: #2f6fed; }
  #info { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7;
    background: #eaf1ff; color: #2f6fed; border: 1px solid #c9dcff; }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #9aa5b1; z-index: 10; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="panel">
    <h1>一对外啮合直齿圆柱齿轮</h1>
    <div class="row">
      <label><span>齿轮1齿数 z1</span><span id="z1Val"></span></label>
      <input type="range" id="z1" min="10" max="30" step="1" value="14">
    </div>
    <div class="row">
      <label><span>齿轮2齿数 z2</span><span id="z2Val"></span></label>
      <input type="range" id="z2" min="10" max="40" step="1" value="24">
    </div>
    <div class="row">
      <label><span>模数 m</span><span id="mVal"></span></label>
      <input type="range" id="m" min="0.15" max="0.35" step="0.01" value="0.22">
    </div>
    <div class="row">
      <label><span>齿轮1转速</span><span id="speedVal"></span></label>
      <input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1.2">
    </div>
    <div id="info" >
      传动比 i₁₂ = z2/z1 = <b id="ratioVal"></b><br>
      分度圆半径：r1=<b id="r1Val"></b>，r2=<b id="r2Val"></b><br>
      中心距 a=m(z1+z2)/2 = <b id="aVal"></b><br>
      <span style="opacity:.7">齿形为示意梯形近似，非真实渐开线；齿数/模数/中心距/传动比均按公式精确计算。</span>
    </div>
  </div>
  <div id="hint">鼠标拖动旋转视角 · 滚轮缩放 · 右键拖动平移</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script>
  // runtime-param-override: 允许 /viewer 通过 URL query 微调滑块初始值，取值范围由滑块自身 min/max 钳制
  (function(){
    var qs = new URLSearchParams(location.search);
    document.querySelectorAll('input[type=range][id]').forEach(function(el){
      if (!qs.has(el.id)) return;
      var num = parseFloat(qs.get(el.id));
      if (isNaN(num)) return;
      var min = parseFloat(el.min), max = parseFloat(el.max);
      if (!isNaN(min)) num = Math.max(min, num);
      if (!isNaN(max)) num = Math.min(max, num);
      el.value = num;
    });
  })();
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
