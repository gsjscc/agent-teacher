<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>圆柱螺旋弹簧 3D 模拟器</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; color: #2a3140; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.9); border: 1px solid #dde3ec; border-radius: 10px;
    padding: 14px 16px; width: 290px; backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #6b7684; margin-bottom: 4px; }
  .row input[type=range] { width: 100%; accent-color: #2f6fed; }
  #info { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.7;
    background: #eaf1ff; color: #2f6fed; border: 1px solid #c9dcff; }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #9aa5b1; z-index: 10; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="panel">
    <h1>圆柱螺旋压缩弹簧</h1>
    <div class="row">
      <label><span>自由高度 H0</span><span id="h0Val"></span></label>
      <input type="range" id="h0" min="1.5" max="2.5" step="0.1" value="2.0">
    </div>
    <div class="row">
      <label><span>有效圈数 n</span><span id="nVal"></span></label>
      <input type="range" id="n" min="4" max="10" step="1" value="6">
    </div>
    <div class="row">
      <label><span>加载速度</span><span id="speedVal"></span></label>
      <input type="range" id="speed" min="0.3" max="2" step="0.1" value="0.8">
    </div>
    <div id="info">
      上方载荷板往复运动，模拟弹簧在 Fmin~Fmax 间的工作循环<br>
      简化模型：压缩过程中圈数不变，弹簧高度线性变化（理想线性弹簧假设），实际弹簧接近极限载荷Flim时会非线性
    </div>
  </div>
  <div id="hint">鼠标拖动旋转视角 · 滚轮缩放 · 右键拖动平移</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
