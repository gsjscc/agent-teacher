<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>凸轮机构 3D 模拟器</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; color: #2a3140; font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(255,255,255,0.9); border: 1px solid #dde3ec; border-radius: 10px;
    padding: 14px 16px; width: 280px; backdrop-filter: blur(4px);
  }
  #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  .row { margin-bottom: 10px; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: #6b7684; margin-bottom: 4px; }
  .row input[type=range] { width: 100%; accent-color: #2f6fed; }
  #info { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.6;
    background: #eaf1ff; color: #2f6fed; border: 1px solid #c9dcff; }
  #hint { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #9aa5b1; z-index: 10; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="panel">
    <h1>凸轮机构参数</h1>
    <div class="row">
      <label><span>基圆半径 r0</span><span id="r0Val"></span></label>
      <input type="range" id="r0" min="0.5" max="1.2" step="0.05" value="0.8">
    </div>
    <div class="row">
      <label><span>升程 h</span><span id="hVal"></span></label>
      <input type="range" id="h" min="0.2" max="1.0" step="0.05" value="0.6">
    </div>
    <div class="row">
      <label><span>转速</span><span id="speedVal"></span></label>
      <input type="range" id="speed" min="0.2" max="2" step="0.1" value="0.8">
    </div>
    <div id="info">运动规律：推程(简谐运动) → 远休止 → 回程(简谐运动) → 近休止<br>从动件位移 s = 基圆半径外的凸轮轮廓变化量，与从动件形式（滚子/尖顶）无关——这是"运动规律设计"和"从动件结构选型"两个独立问题。</div>
  </div>
  <div id="hint">鼠标拖动旋转视角 · 滚轮缩放 · 右键拖动平移</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
